name: Django CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Django unit tests (SQLite)
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: metrodrip_backend/requirements.txt

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r metrodrip_backend/requirements.txt

    - name: Run Django Tests
      working-directory: metrodrip_backend
      run: |
        python manage.py test --verbosity 2

