name: Deploy Tech Stack Setup to GitHub Pages

on:
  push:
    branches: ["master"]
    paths:
      - 'Project Guidelines/tech-stack-setup.html'
      - '.github/workflows/static.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site bundle
        run: |
          mkdir -p _site
          # Deploy tech-stack-setup.html as root index.html
          cp "Project Guidelines/tech-stack-setup.html" _site/index.html
          # Keep alias at /tech-stack-setup.html
          cp "Project Guidelines/tech-stack-setup.html" _site/tech-stack-setup.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

