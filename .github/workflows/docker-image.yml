# Note: No root Dockerfile exists in this repository (deployment target is Render via render.yaml).
# Disabled automatic push/PR triggers to avoid false CI failures.
name: Docker Image CI

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
